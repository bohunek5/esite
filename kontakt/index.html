<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark"><title>E-site · Wejście</title>
<style id="esite-gate-style">
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#0f1116;color:#f2f0eb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:28px}.entry{width:min(100%,420px)}.brand{font-size:28px;letter-spacing:-1.5px;font-weight:750;margin:0 0 64px}.brand span{color:#c8afe9}.label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#b7aba2}h1{font-size:clamp(34px,9vw,46px);font-weight:500;letter-spacing:-2px;line-height:1.12;margin:17px 0 17px}.intro{color:#aaa8ad;line-height:1.7;margin:0 0 30px}label{display:block;font-size:13px;margin-bottom:9px}input{width:100%;height:54px;padding:0 16px;border:1px solid #45454d;border-radius:10px;background:#181a22;color:#fff;font:inherit;outline:none}input:focus{border-color:#c8afe9;box-shadow:0 0 0 3px #c8afe920}button{width:100%;height:54px;margin-top:12px;border:0;border-radius:10px;background:#c8afe9;color:#191614;font:600 14px system-ui;cursor:pointer}button:hover{background:#decbf6}button:focus-visible{outline:3px solid #fff;outline-offset:3px}button:disabled{cursor:wait;opacity:.65}#entry-status{min-height:44px;line-height:1.5;margin:14px 0 0;font-size:13px;color:#d1c9c3}#entry-status[data-error]{color:#ffb4a6}.fine{margin-top:40px;color:#777780;font-size:12px;line-height:1.6}@media(prefers-reduced-motion:no-preference){button,input{transition:background .2s,border-color .2s}}
</style></head><body><main><section class="entry" aria-labelledby="entry-title"><p class="brand">e-site<span>.</span></p><p class="label">Karol × Kinga</p><h1 id="entry-title">Dobrze Cię<br>widzieć.</h1><p class="intro">Wpisz hasło, aby zobaczyć stronę.</p><form id="entry-form"><label for="entry-password">Hasło dostępu</label><input id="entry-password" type="password" autocomplete="off" required autofocus><button id="entry-submit" type="submit">Otwórz stronę <span aria-hidden="true">↗</span></button><p id="entry-status" role="status" aria-live="polite"></p></form><p class="fine">Dostęp pozostaje otwarty w tej karcie do odświeżenia strony.</p></section></main>
<script type="module" src="/esite/protected-gate.js"></script></body></html>
